<style>

button.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}

@media(max-width:520px){.entry{grid-template-columns:1fr}.bignum{font-size:1.45rem}.slider{min-width:9rem}}

<!-- ============ 1. 工具 / 状态 / 音效 / 几何 / 拖拽 ============ -->
<script>
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function E(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
window.onerror=function(m,u,l){var e=E('err');if(e){e.style.display='block';e.textContent='⚠️ 页面出错：'+m+'（第 '+l+' 行）。把这句话发给老师。';}};
var DEF={theme:'green',font:1,sound:true,star:0,coin:0,done:{},wrong:[],stat:{},name:'',bank:[],flags:[]};
var S=(function(){var d=JSON.parse(JSON.stringify(DEF));try{var s=JSON.parse(localStorage.getItem('jdm_v2')||'{}');for(var k in d){if(s[k]!==undefined)d[k]=s[k];}}catch(e){}return d;})();
function save(){try{localStorage.setItem('jdm_v2',JSON.stringify(S));}catch(e){}}
function toast(t){var e=E('toast');if(!e)return;e.textContent=t;e.className='toast on';clearTimeout(e._t);e._t=setTimeout(function(){e.className='toast';},2200);}
function hud(){
  var a=E('pillStar'),b=E('pillCoin');
  if(a)a.innerHTML='⭐ ×'+Math.floor(S.star/2)+(S.star%2?'◐':'');
  if(b)b.innerHTML='🪙 '+S.coin;
}
function addStar(u){S.star+=u;save();hud();}
function addCoin(n){S.coin+=n;save();hud();}
var AC=null;
function sfx(kind){
  if(!S.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime;
    function p(f,d,type,v,delay){var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t+(delay||0));g.gain.exponentialRampToValueAtTime(.001,t+(delay||0)+d);o.connect(g);g.connect(AC.destination);o.start(t+(delay||0));o.stop(t+(delay||0)+d);}
    if(kind==='ok'){p(660,.12,'sine',.06,0);p(990,.16,'sine',.05,.1);}
    else if(kind==='snap'){p(880,.1,'triangle',.055,0);p(1320,.14,'triangle',.04,.09);}
    else if(kind==='tip'){p(300,.16,'triangle',.045,0);}
    else if(kind==='star'){p(784,.18,'sine',.06,0);p(988,.18,'sine',.06,.11);p(1175,.2,'sine',.06,.22);}
    else{p(520,.06,'square',.025,0);}
  }catch(e){}
}
function ptOn(cx,cy,r,deg){var a=deg*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)};}
function norm180(a){while(a>180)a-=360;while(a<-180)a+=360;return a;}
function norm360(a){a=a%360;if(a<0)a+=360;return a;}
function mod180(a){a=norm360(a);if(a>=180)a-=180;return a;}
function dist(x1,y1,x2,y2){return Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));}
function arcPath(cx,cy,r,a,b){var s=ptOn(cx,cy,r,a),e=ptOn(cx,cy,r,b),L=((b-a)>180)?1:0;return 'M'+s.x.toFixed(1)+','+s.y.toFixed(1)+' A'+r+','+r+' 0 '+L+' 0 '+e.x.toFixed(1)+','+e.y.toFixed(1);}
function strokeArc(cx,cy,r,a,b,color,w){return '<path d="'+arcPath(cx,cy,r,a,b)+'" fill="none" stroke="'+color+'" stroke-width="'+(w||5)+'" stroke-linecap="round"/>';}
function uprightS(cx,cy,r,deg,txt,cls){return '<g transform="translate('+cx+','+cy+') rotate('+deg+') translate(0,'+(-r)+') rotate('+(-deg)+')"><text class="'+(cls||'svgtxt')+'" text-anchor="middle" dominant-baseline="middle">'+txt+'</text></g>';}
function scaleHandle(g,k){if(!g)return;var es=g.querySelectorAll('[data-r]');for(var i=0;i<es.length;i++){es[i].setAttribute('r',(parseFloat(es[i].getAttribute('data-r'))*k).toFixed(1));}}
function svgFrame(inner,h){return '<svg viewBox="0 0 480 '+(h||330)+'" class="stagesvg" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';}
function toPt(svg,ev){var r=svg.getBoundingClientRect();var k=r.width/480;if(!k||k<0.01)k=1;return {x:(ev.clientX-r.left)/k,y:(ev.clientY-r.top)/k};}
function makeDraggable(el,opt){
  if(!el)return;
  var pid=null,moved=false,raf=0,last=null,start=null;
  el.style.touchAction='none';el.style.cursor='grab';
  function flush(){raf=0;if(last&&opt.move)opt.move(last.x,last.y);last=null;}
  el.addEventListener('pointerdown',function(e){
    if(pid!==null)return;
    pid=e.pointerId;start={x:e.clientX,y:e.clientY};moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    el.classList.add('dragging');
    if(opt.start)opt.start();
    sfx('click');e.preventDefault();
  });
  el.addEventListener('pointermove',function(e){
    if(pid===null||e.pointerId!==pid)return;
    if(!moved&&(Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y)>4))moved=true;
    if(!moved)return;
    last=opt.toXY?opt.toXY(e):{x:e.clientX,y:e.clientY};
    if(!raf)raf=requestAnimationFrame(flush);
    e.preventDefault();
  });
  function end(e){
    if(pid===null||e.pointerId!==pid)return;
    pid=null;last=null;
    if(raf){cancelAnimationFrame(raf);raf=0;}
    el.classList.remove('dragging');
    if(opt.end)opt.end();
  }
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('lostpointercapture',end);
}
var stack=[];
function setView(h){var v=E('view');if(v)v.innerHTML=h;}
function go(fn,crumb){if(crumb){var c=E('crumb');if(c)c.textContent=crumb;}stack.push(fn);try{fn();}catch(e){if(window.onerror)window.onerror(e.message,'',0);}window.scrollTo(0,0);}
function goBack(){if(CUR&&CUR.stop)CUR.stop();if(stack.length>1)stack.pop();var f=stack[stack.length-1];if(f)f();else home();window.scrollTo(0,0);}
function goHome(){if(CUR&&CUR.stop)CUR.stop();stack=[home];home();window.scrollTo(0,0);}
function modal(h){var m=E('modal');if(m)m.innerHTML=h;var k=E('mask');if(k)k.className='mask on';}
function closeMask(){var k=E('mask');if(k)k.className='mask';}
var UNITS=['万以上数的认识','角的度量','多位数乘两位数','加法模型和乘法模型','平行四边形和梯形','条形统计图','寻找宝藏','复习与关联'];
var TOPICS=['线的认识','角的分类','量角读数','画角','平角周角','时间中的角','边长与角','折纸推理'];

 st:{A:{x:110,y:85},B:{x:330,y:85},P:{x:110,y:200},Q:{x:240,y:180},C:{x:130,y:290},D:{x:350,y:290}},

  this.svg=stage.querySelector('svg');

     move:function(x,y){set(cl({x:x,y:y}));self.render();},end:function(){scaleHandle(node,1);}});

<!-- ============ 4. 页面 / 引擎 / 答题 / 回顾本 / 教师端 ============ -->
<script>
var CUR=null,CQ=null,microTok=0;
function home(){
  var c=E('crumb');if(c)c.textContent='四年级上册 · 数学';
  var u='';
  for(var i=0;i<UNITS.length;i++){
    var n=i+1,lock=(n!==2);
    u+='<div class="unit '+(lock?'locked':'active')+'" onclick="'+(lock?'lockTip()':'go(unit2,\'角的度量\')')+'">'+(lock?'':'<span class="badge-new">已解锁</span>')+
     '<div><div class="no">第'+n+'单元</div><div class="nm">'+UNITS[i]+'</div></div><div class="small">'+(lock?'🔒':'探索馆 · 挑战馆')+'</div></div>';
  }
  setView('<div class="wrap"><div class="h1">数学探险地图</div><div class="sub">先去看看"角"，那里藏着一整个圆的小秘密。</div><div class="units">'+u+'</div></div>');
  hud();
}
function lockTip(){sfx('tip');modal('<div class="h1" style="font-size:1.1rem">小探险家</div><p>这片区域还在建造中，先去<b>"角的度量"</b>解锁你的量角器技能吧！</p><div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeMask()">好，去看看</button></div>');}
function unit2(){
  var c=E('crumb');if(c)c.textContent='角的度量';
  var d=0,k;for(k in S.done){if(S.done[k]&&S.done[k].c)d++;}
  var q=0;for(k in S.stat){if(S.stat[k])q+=S.stat[k].t;}
  setView('<div class="wrap"><div class="h1">第二单元 · 角的度量</div><div class="sub">度量就是数单位——一个角里有几个 1°，它就是几度。</div>'+
   '<div class="entry"><button class="big" onclick="go(exploreMap,\'探索馆\')">🔭<b>探索馆</b><span>七个动手小实验<br>已完成 '+d+' / 7</span></button>'+
   '<button class="big" onclick="go(challengeHome,\'挑战馆\')">🎯<b>挑战馆</b><span>八类题型 · 每轮 6 题<br>已完成 '+q+' 题</span></button></div>'+
   '<div class="card" style="margin-top:.9rem"><div class="row" style="justify-content:space-between"><b>我的回顾本</b><button class="btn mini" onclick="go(reviewBook,\'回顾本\')">打开（'+S.wrong.length+' 条）</button></div><div class="small">这里放的没有想清楚的地方。</div></div></div>');
  hud();
}
function exploreMap(){
  var c=E('crumb');if(c)c.textContent='探索馆';
  var h='<div class="wrap"><div class="h1">探索馆 · 路线图</div><div class="sub">七个小实验，从哪一站开始都可以。</div>';
  STATIONS.forEach(function(st){
    h+='<div class="station"><div class="st-head"><span class="dot">'+st.id+'</span>第'+st.id+'站 · '+st.name+'</div>';
    st.demos.forEach(function(id){
      var d=DEMOS[id],done=S.done[id]&&S.done[id].c;
      h+='<div class="demo'+(done?' done':'')+'" onclick="go(function(){startDemo(\''+id+'\');},\'探索馆\')"><span class="ic">'+d.icon+'</span><span><b>'+d.name+'</b><small>'+d.desc+'</small></span><span style="margin-left:auto">'+(done?'✅':'▶️')+'</span></div>';
    });
    h+='</div>';
  });
  setView(h+'</div>');hud();
}
function startDemo(id){var d=DEMOS[id];if(!d||!d.ready){toast('这个小实验还没装好');return;}
  CUR={id:id,demo:d,phase:1,stop:function(){microTok++;windTok++;}};
  var c=E('crumb');if(c)c.textContent='探索馆 · '+d.name;
  setView('<div class="wrap"><div class="h1">'+d.icon+' '+d.name+'</div><div class="sub">'+d.desc+'</div>'+
   '<div class="stagewrap"><div class="stage" id="stage"></div><div class="overlay"><div class="bignum" id="bignum">--</div><div class="nametag" id="nametag">--</div></div></div>'+
   '<div class="infobar" id="infobar"></div>'+
   '<div class="subtitle" id="subtitle">先看 20 秒"我怎么拖"，然后自己上手。</div>'+
   '<div class="phases"><div class="ph" id="ph1" onclick="setPhase(1)">① 微演示</div><div class="ph" id="ph2" onclick="setPhase(2)">② 动手玩</div><div class="ph" id="ph3" onclick="setPhase(3)">③ 小挑战</div></div>'+
   '<div class="card" id="ctl"></div><div id="panel"></div></div>');
  d.mount(E('stage'));setPhase(1);
}
function setPhase(n){
  if(!CUR)return;
  microTok++;CUR.phase=n;
  for(var i=1;i<=3;i++){var e=E('ph'+i);if(e)e.className='ph'+(i===n?' on':'');}
  if(n===1)phaseMicro();else if(n===2)phasePlay();else phaseQuiz();
}
function phaseMicro(){
  var d=CUR.demo;d.reset();
  var st=E('subtitle');if(st)st.innerHTML='点下面的按钮，看我怎么拖（20 秒）。';
  var ct=E('ctl');if(ct)ct.innerHTML='<div class="row"><button class="btn primary" id="microBtn" onclick="playMicro()">▶️ 播放 20 秒演示</button><button class="btn" onclick="setPhase(2)">直接动手玩 →</button></div>';
  var pn=E('panel');if(pn)pn.innerHTML='';
}
function playMicro(){
  var d=CUR.demo;if(!d.micro)return;
  var tok=++microTok,i=0,btn=E('microBtn');
  if(btn){btn.disabled=true;btn.textContent='演示中…';}
  function next(){
    if(tok!==microTok)return;
    if(i>=d.micro.length){
      var ct=E('ctl');if(ct)ct.innerHTML='<div class="row"><button class="btn primary" onclick="setPhase(2)">✋ 去动手玩 →</button><button class="btn" onclick="playMicro()">🔁 再看一遍</button></div>';
      var st=E('subtitle');if(st)st.innerHTML='看完了，轮到你——自己去拖一拖。';
      return;
    }
    var s=d.micro[i],st=E('subtitle');if(st)st.innerHTML=s.text;
    if(s.before)s.before(d);
    tweenStep(tok,Math.max(700,(s.t-0.7)*1000),function(k){if(s.tick)s.tick(k,d);d.render();},function(){i++;setTimeout(next,420);});
  }
  next();
}
function tweenStep(tok,dur,onTick,cb){
  var t0=null;
  function step(ts){
    if(tok!==microTok)return;
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    onTick(k);
    if(k<1)requestAnimationFrame(step);else if(cb)cb();
  }
  requestAnimationFrame(step);
}
function phasePlay(){
  var d=CUR.demo;d.reset();
  var st=E('subtitle');if(st)st.innerHTML='✋ 直接上手拖；三个标签可以随时点回别的环节。';
  var ct=E('ctl');if(ct)ct.innerHTML=d.controlsHTML?d.controlsHTML():'';
  var pn=E('panel');if(pn)pn.innerHTML=d.panelHTML?d.panelHTML():'';
  if(d.syncUI)d.syncUI();
  d.render();
  var p1=E('ph1');if(p1)p1.className='ph done';
}
function phaseQuiz(){
  if(!CUR)return;
  var d=CUR.demo,ch=d.challenge||{};
  d.reset();CQ={i:0};
  var st=E('subtitle');if(st)st.innerHTML=ch.subtitle||((ch.goals&&ch.goals.length)?('🎯 小挑战：拖到 '+ch.goals.join('° → ')+'°'):'🎯 小挑战');
  var ct=E('ctl');if(ct)ct.innerHTML=ch.controlsHTML?ch.controlsHTML():'<div class="row"><button class="btn" onclick="setPhase(3)">🔁 重来</button><button class="btn" onclick="setPhase(2)">回到动手玩</button></div>';
  var pn=E('panel');if(pn)pn.innerHTML=ch.panelHTML?ch.panelHTML():'';
  var p2=E('ph2');if(p2)p2.className='ph done';
  if(ch.kind==='drag')renderGoals();
  else if(ch.kind==='ask')renderAsk();
  else CQ=null;
  if(ch.onStart)ch.onStart();
}
function renderGoals(){
  var ch=CUR.demo.challenge,g=ch.goals,h='<div class="card"><b>拖到下面的度数：</b><div class="goals">';
  for(var i=0;i<g.length;i++)h+='<div class="goal'+(i<CQ.i?' done':(i===CQ.i?' now':''))+'" id="goal'+i+'">'+g[i]+'°</div>';
  h+='</div><div class="small" id="goalhint" style="margin-top:.55rem">'+ch.tip+'</div></div>';
  var pn=E('panel');if(pn)pn.innerHTML=h;
}
function checkGoal(){
  if(!CQ||!CUR||CUR.phase!==3)return;
  var ch=CUR.demo.challenge;if(!ch||ch.kind!=='drag'||!ch.goals)return;
  var g=ch.goals;if(CQ.i>=g.length)return;
  var v=(ch.value?ch.value():CUR.demo.state.angle);if(v===-1)return;
  var t=g[CQ.i],dd=Math.abs(v-t),hh=E('goalhint');
  if(dd<=2){
    sfx('snap');var el=E('goal'+CQ.i);if(el)el.className='goal done';CQ.i++;
    if(CQ.i>=g.length)finishChal();
    else{if(hh)hh.innerHTML='🎉 对了！下一个目标：'+g[CQ.i]+'°';var ne=E('goal'+CQ.i);if(ne)ne.className='goal now';}
  }else if(dd<=8){if(hh)hh.innerHTML='快到了，再'+(v<t?'调大一点':'调小一点')+'，还差 '+dd+'°。';}
}
function renderAsk(){
  var it=CUR.demo.challenge.items[CQ.i];
  var h='<div class="card"><b>第 '+(CQ.i+1)+' / '+CUR.demo.challenge.items.length+' 题　'+it.q+'</b><div class="row" style="margin-top:.5rem">';
  for(var i=0;i<it.opts.length;i++)h+='<button class="btn mini" onclick="askAns('+i+')">'+it.opts[i]+'</button>';
  h+='</div><div id="askfb" class="fb tip" style="display:none"></div></div>';
  var pn=E('panel');if(pn)pn.innerHTML=h;
}
function askAns(i){
  var it=CUR.demo.challenge.items[CQ.i],fb=E('askfb');
  if(i===it.a){sfx('ok');CQ.i++;
    if(CQ.i>=CUR.demo.challenge.items.length)finishChal();
    else{renderAsk();toast('答对啦，下一题');}}
  else{sfx('tip');if(fb){fb.style.display='block';fb.innerHTML='这里有个小陷阱，再试一次吧！💭 '+(it.h||'');}}
}
function finishChal(){
  sfx('star');addStar(2);addCoin(5);
  var id=CUR.id;S.done[id]=S.done[id]||{};S.done[id].c=1;S.done[id].star=Math.max(S.done[id].star||0,2);save();
  var p3=E('ph3');if(p3)p3.className='ph on done';
  var hh=E('goalhint');if(hh)hh.innerHTML='🏆 全部过关！你已经会自己把这个角调出来了。';
  var pn=E('panel');if(pn)pn.innerHTML+='<div class="card"><b>🎉 小挑战完成</b><div class="small">拿到 1 颗星和 5 枚金币。</div><div class="row" style="margin-top:.5rem"><button class="btn primary" onclick="go(exploreMap,\'探索馆\')">回到路线图</button><button class="btn" onclick="setPhase(2)">再玩一会儿</button></div></div>';
}
function challengeHome(){
  var c=E('crumb');if(c)c.textContent='挑战馆';
  var cards=TOPICS.map(function(t){var s=S.stat[t]||{r:0,t:0};return '<button class="big" onclick="go(function(){startTopic(\''+t+'\');},\'挑战馆\')"><b>'+t+'</b><span>做过 '+s.t+' 题'+(s.t?('（一次想通 '+s.r+' 题）'):'')+'</span></button>';}).join('');
  setView('<div class="wrap"><div class="h1">挑战馆</div><div class="sub">挑一个方向，每轮 6 题，约 5 分钟。想混着来就点"混合闯关"。</div>'+
   '<button class="btn dark" style="width:100%;padding:.9rem;font-size:1.05rem" onclick="go(function(){startTopic(null);},\'挑战馆\')">🎲 混合闯关（推荐）</button>'+
   '<div class="entry" style="margin-top:.8rem">'+cards+'</div></div>');
  hud();
}
function startTopic(topic){
  var pool=allQ().filter(function(q){return !topic||q.topic===topic;});
  if(pool.length<6)pool=allQ();
  var ez=pool.filter(function(q){return q.diff===1;}),md=pool.filter(function(q){return q.diff===2;}),hd=pool.filter(function(q){return q.diff===3;});
  function pick(a,n){var b=a.slice(),o=[];while(o.length<n&&b.length)o.push(b.splice(Math.floor(Math.random()*b.length),1)[0]);return o;}
  var list=pick(ez,2).concat(pick(md,3)).concat(pick(hd,1));
  for(var i=0;i<pool.length&&list.length<6;i++){if(list.indexOf(pool[i])<0)list.push(pool[i]);}
  runQuiz(list,{title:'挑战馆 · '+(topic||'混合闯关')});
}
var QZ=null;
function runQuiz(list,opt){
  opt=opt||{};
  QZ={list:list.slice(),i:0,title:opt.title,first:0,coin:0,tries:0,used:false,done:false,ans:null,kp:'',order:[]};
  renderQuiz();
}
function renderQuiz(){
  if(QZ.i>=QZ.list.length){finishQuiz();return;}
  var q=QZ.list[QZ.i];
  QZ.tries=0;QZ.used=false;QZ.done=false;QZ.ans=null;QZ.kp='';QZ.order=[];
  var c=E('crumb');if(c)c.textContent=QZ.title;
  setView('<div class="wrap"><div class="row" style="justify-content:space-between"><b>'+QZ.title+'</b><span class="small">第 '+(QZ.i+1)+' / '+QZ.list.length+' 题</span></div>'+
   '<div class="card"><div class="small">'+q.topic+' · '+['','基础','提升','挑战'][q.diff]+'</div><div style="font-size:1.1rem;font-weight:700;margin:.3rem 0">'+esc(q.stem)+'</div><div id="qarea"></div>'+
   '<div class="row" style="margin-top:.8rem;justify-content:space-between;width:100%"><button class="btn mini" id="hintBtn" onclick="useHint()" disabled>💡 需要一点线索</button><button class="btn primary" id="subBtn" onclick="submitAns()">确认</button></div>'+
   '<div id="fb"></div><button class="flagbtn" onclick="flagQ()">🖐️ 这题有问题 / 我想反馈</button></div></div>');
  drawQ(q);
}
function flagQ(){
  var q=QZ.list[QZ.i];
  modal('<div class="h1" style="font-size:1.05rem">这道题帮你反馈给老师</div><div class="small">'+esc(q.stem)+'</div>'+
   '<div class="row" style="margin-top:.6rem"><button class="btn mini" onclick="doFlag(\'题目打错了\')">题目打错了</button><button class="btn mini" onclick="doFlag(\'答案不对\')">答案不对</button><button class="btn mini" onclick="doFlag(\'我看不懂\')">我看不懂</button><button class="btn mini" onclick="doFlag(\'图和题对不上\')">图和题对不上</button></div>'+
   '<div class="row" style="justify-content:flex-end;margin-top:.7rem"><button class="btn" onclick="closeMask()">取消</button></div>');
}
function doFlag(reason){
  var q=QZ.list[QZ.i];
  S.flags.push({id:q.id,stem:q.stem,topic:q.topic,reason:reason,t:new Date().toLocaleString()});
  save();closeMask();sfx('ok');toast('谢谢你的反馈，老师会看到的！');
}
function drawQ(q){
  var a=E('qarea');if(!a)return;
  if(q.type==='c'){
    var h='';for(var i=0;i<q.options.length;i++)h+='<button class="btn" style="display:block;width:100%;text-align:left;margin:.4rem 0" id="op'+i+'" onclick="pickOne('+i+')">'+'ABCD'[i]+'．'+esc(q.options[i])+'</button>';
    a.innerHTML=h;
  }else if(q.type==='k'){
    var v='';for(var n=1;n<=9;n++)v+='<button class="btn mini" style="min-width:2.6rem" onclick="kpPush('+n+')">'+n+'</button>';
    v+='<button class="btn mini" style="min-width:2.6rem" onclick="kpPush(0)">0</button><button class="btn mini" onclick="kpDel()">删除</button><button class="btn mini" onclick="kpClr()">清空</button>';
    a.innerHTML='<div class="row"><span>我的答案：</span><span style="display:inline-block;min-width:4rem;border-bottom:3px solid var(--red);text-align:center;font-weight:900;font-size:1.3rem;color:var(--red)" id="kp">?</span><span>'+(q.unit||'')+'</span></div><div class="row" style="margin-top:.5rem;max-width:17rem">'+v+'</div>';
  }else if(q.type==='s'){
    var it='';for(var j=0;j<q.items.length;j++)it+='<span class="pill" id="it-'+q.items[j].id+'" onclick="pickItem(\''+q.items[j].id+'\')" style="cursor:pointer;margin:.15rem">'+esc(q.items[j].t)+'</span>';
    var bk='';for(var m=0;m<q.baskets.length;m++)bk+='<div onclick="dropTo(\''+q.baskets[m]+'\')" style="cursor:pointer;border:2px dashed var(--line);border-radius:.8rem;padding:.45rem;flex:1;min-width:6rem"><b class="small">'+esc(q.baskets[m])+'</b><div id="in-'+q.baskets[m]+'" class="small"></div></div>';
    a.innerHTML='<div class="row">'+it+'</div><div class="row" style="margin-top:.5rem;align-items:stretch">'+bk+'</div><div class="small" style="margin-top:.3rem">先点上面的词，再点下面的筐。</div>';

function chkQ(q){
  var e=[];
  if(!q||typeof q!=='object')return ['不是一条题目'];
  if(!q.id)e.push('缺少 id');if(!q.stem)e.push('缺少 stem');
  if(['c','k','s','o'].indexOf(q.type)<0)e.push('type 只能是 c/k/s/o');
  if(q.type==='c'&&(!Array.isArray(q.options)||typeof q.answer!=='number'))e.push('c 需要 options 和数字 answer');
  if(q.type==='k'&&typeof q.answer!=='number')e.push('k 的 answer 要填数字');
  if(q.type==='s'&&(!Array.isArray(q.items)||!Array.isArray(q.baskets)||!q.answer))e.push('s 需要 items/baskets/answer');
  if(q.type==='o'&&(!Array.isArray(q.steps)||!Array.isArray(q.answer)))e.push('o 需要 steps 和 answer');
  return e;
}

function doImport(arr,msg){
  var ok=[],bad=[];
  arr.forEach(function(q,i){var e=chkQ(q);if(e.length)bad.push('第'+(i+1)+'条：'+e.join('；'));else ok.push({id:q.id,topic:q.topic||'未分类',demo:q.demo||'D2',type:q.type,stem:q.stem,options:q.options,answer:q.answer,steps:q.steps,items:q.items,baskets:q.baskets,unit:q.unit||'',hint1:q.hint1||'再读一遍题目。',hint2:q.hint2||'回探索馆看一眼演示。',solution:q.solution||[],explain:q.explain||'',diff:q.diff||2});});
  S.bank=(S.bank||[]).concat(ok);save();
  var h='<b style="color:#2E9E5B">成功导入 '+ok.length+' 道题</b>';
  if(bad.length)h+='<br><b style="color:#E67E22">有 '+bad.length+' 条没导入：</b><br>'+bad.slice(0,5).map(esc).join('<br>');
  if(msg)msg.innerHTML=h;toast('导入 '+ok.length+' 道题');
}
function importText(){try{var a=JSON.parse(E('bt').value);if(!Array.isArray(a))throw new Error('最外层要是数组');doImport(a,E('bmsg'));}catch(e){E('bmsg').innerHTML='<b style="color:#C0392B">导入失败：'+esc(e.message)+'</b>';}}
function importFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var a=JSON.parse(r.result);if(!Array.isArray(a))throw new Error('最外层要是数组');doImport(a,E('bmsg'));}catch(e){toast('导入失败：'+e.message);}};r.readAsText(f,'utf-8');}
function dl(name,txt){try{var b=new Blob([txt],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);toast('已下载');}catch(e){toast('下载失败');}}
function dlTpl(){dl('题库导入模板.json',JSON.stringify([{id:'C1',topic:'角的分类',demo:'D2',type:'c',stem:'比直角小的角是什么角？',options:['锐角','直角','钝角'],answer:0,hint1:'想想门开一条小缝时。',hint2:'比90°小的是锐角。',solution:['比直角小就是锐角'],explain:'锐角比直角小。',diff:1}],null,2));}
function dlBank(){dl('角的度量题库.json',JSON.stringify(allQ(),null,1));}
try{stack=[home];home();window.__booted=true;}catch(e){if(window.onerror)window.onerror(e.message,'',0);}
