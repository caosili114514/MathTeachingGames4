var AC=null;
function sfx(kind){
  if(!S.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime;

DEMOS.D3={name:'1°角的诞生',icon:'🌗',desc:'把圆平均分成360份，其中1份就是1°',

 script:[
  {t:8,text:'量角器凭什么能量出角度？因为它身上藏着一个小得不能再小的角。',p:{step:0}},
  {t:9,text:'把一个大圆平均分成360份，其中1份的角，就是1度，写作1°。',p:{step:1}},

  {t:8,text:'现在把它放大——这是半圆，被平均分成了180份。',p:{step:2}},
  {t:7,text:'量角器，其实就是180个1°小角手拉手拼成的。',p:{step:2}},
  {t:9,text:'所以量角不是魔法，它是在数：这个角里面装了几个1°。',p:{step:2}},
  {t:7,text:'装了30个1°，就是30°；装了90个1°，就是90°。',p:{step:2}},
  {t:6,text:'记住这句话：度量，就是数单位。',p:{step:2}},

DEMOS.D4={name:'量角器的秘密',icon:'📐',desc:'中心对顶点，0线对一边，再看另一条边',

   t+n+'<text x="'+cx+'" y="'+(cy-26)+'" class="svgtxt sm" text-anchor="middle">中心对顶点，0线对一边</text></g>'+
   '<g id="d4sec"></g><g id="d4base"></g><g id="d4mov"></g>'+

 update:function(el,p){

 },
 script:[
  {t:8,text:'量角器上每一小格，都是1°；它一共有180个1°。',p:{angle:65}},
  {t:8,text:'量角三步走。第一步：中心点，对准角的顶点。',p:{angle:65}},
  {t:7,text:'第二步：0刻度线，对准角的一条边。',p:{angle:65}},
  {t:9,text:'第三步：看另一条边压在哪条刻度线上，读出来，就是度数。',p:{angle:65}},
  {t:9,text:'小心！量角器上有两圈刻度：一圈从右边0开始，一圈从左边0开始。',p:{angle:65,flip:false}},
  {t:9,text:'0刻度线在右边，就读内圈；0刻度线在左边，就读外圈。现在把量角器翻过来看看。',p:{angle:65,flip:true}},
  {t:8,text:'本来是65°的角，如果读错一圈，就会读成115°，那就差了一大截。',p:{angle:65,flip:false}},
  {t:8,text:'所以量角之前，先看0刻度线在哪边，再决定读哪一圈。',p:{angle:65}},

  controls:'<div class="slider"><span>角的另一条边</span><input type="range" min="1" max="180" value="65" oninput="D4set(this.value)"><b id="d4v">65°</b></div>'+

  discover:[['90°','no'],['180°','yes'],['360°','no']],answer:'yes',right:'内圈读数＋外圈读数＝180°，因为它俩合起来正好是半个圆。'}

DEMOS.D5={name:'折彝族头巾 · 周角折叠',icon:'🧣',desc:'铺平看周角：先减一减，再平均分',

   '<text x="240" y="34" class="svgtxt" text-anchor="middle" id="d5t1"></text>'+
   '<text x="240" y="58" class="svgtxt" text-anchor="middle" id="d5t2"></text>');
 },
 update:function(el,p){
  p=p||{};

  if(sc)sc.innerHTML=sectorS(240,170,112,0,a1,'var(--red)')+sectorS(240,170,112,a1,a1+a2,'var(--yellow)')+sectorS(240,170,112,a1+a2,359.7,'#2E9E5B');

  var t1=$('#d5t1',el),t2=$('#d5t2',el);
  if(t1)t1.textContent='∠1 = '+a1+'°　∠2 = '+a2+'°';
  if(t2)t2.textContent=(p.step>=2)?('360° − '+a1+'° = '+(360-a1)+'°，再平均分成2份，∠2 = '+a2+'°'):((p.step>=1)?'两块一样大的 ∠2 加一块 ∠1 = 360°':'');
  showBig('∠1 = '+a1+'°　∠2 = '+a2+'°');
 },
 script:[

  {t:9,text:'已知∠1是70°。先从360°里减去70°：360°−70°＝290°。',p:{unfold:1,step:1,a1:70}},

 ],

 script:[

DEMOS.D7={name:'风筝能飞多高',icon:'🪁',desc:'线一样长，夹角越大飞得越高，最大90°',
 mount:function(el){

   '<text x="64" y="318" class="svgtxt sm" text-anchor="middle">木桩</text>'+
   '<text x="330" y="140" class="svgtxt sm">呼——</text>');
 },
 update:function(el,p){
  p=p||{};
  var a=Math.max(1,Math.min(90,p.angle||40));

  if(ln)ln.innerHTML=rayS(64,285,210,a,'#C0392B',5);

   cmp.setAttribute('opacity',p.cmp?1:0);
   cmp.innerHTML=rayS(64,285,210,50,'var(--muted)',3)+rayS(64,285,210,65,'var(--ink)',3);
  }
  var bars=0;
  try{
   var g=$('#d7ground',el).getBoundingClientRect();
   var k=$('#d7kite',el).getBoundingClientRect();
   var rr=$('#d7ruler',el).getBoundingClientRect();
   var rise=g.top-k.top;
   if(rr.height>0)bars=Math.round(rise/rr.height*9);
   if(bars<0)bars=0;
   if(bars>9)bars=9;

 script:[

  {t:9,text:'再往后仰，线倒向身后，风就托不住风筝了，它会往下掉。',p:{angle:90}},

  {t:10,text:'现在轮到梦梦的50°了——你猜，它会不会正好在40°和65°中间？',p:{angle:50,cmp:true}}
 ],
 explore:{tasks:['拖动滑块（1°到90°），看风筝和旁边的高度标尺一起变。','分别停在 40°、50°、65°，比一比谁飞得高。','把滑块一直拖到 90°，看看还能不能再往上一格？'],
  controls:'<div class="slider"><span>夹角</span><input type="range" min="1" max="90" value="40" oninput="D7set(this.value)"><b id="d7v">40°</b></div>'+
   '<div class="row"><button class="btn mini" onclick="D7set(40)">40°</button><button class="btn mini" onclick="D7set(50)">50°</button><button class="btn mini" onclick="D7set(65)">65°</button></div>'+
   '<div class="small">90°的时候，线已经垂直地面啦，再倾斜就没有风能托住它了，所以最大夹角是90°哦！</div>',
  discover:[['越高','yes'],['越低','no']],answer:'yes',right:'线一样长，角越大，风筝飞得越高，最高就是90°。'}
};
/* ---- 演示里的滑块回调 ---- */
var D2p={angle:45,edge:150},D3n={n:0},D4p={angle:65,flip:false},D5p={a1:40,unfold:1,step:2},D6p={a1:20,a2:20},D7p={angle:40};
function D1go(k){sfx('click');DEMOS.D1.update(E('stage'),{ext:k,shake:(k===1)});}
function D2set(v,len){
  if(v!==null&&v!==undefined)D2p.angle=+v;
  if(len===1)D2p.edge=210;
  if(len===-1)D2p.edge=90;
  var e=E('d2v');if(e)e.textContent=D2p.angle+'°';
  DEMOS.D2.update(E('stage'),D2p);
}
function D3walk(k){
  sfx('click');
  D3n.n=(k===-999)?0:Math.min(360,D3n.n+k);
  var e=E('d3n');if(e)e.textContent='已经装了 '+D3n.n+' 个1°';
  showBig(D3n.n+' 个1° ＝ '+D3n.n+'°');
}
function D4set(v){D4p.angle=+v;var e=E('d4v');if(e)e.textContent=v+'°';DEMOS.D4.update(E('stage'),D4p);}
function D4flip(){D4p.flip=!D4p.flip;sfx('click');DEMOS.D4.update(E('stage'),D4p);}
function D5set(v){D5p.a1=+v;var e=E('d5v');if(e)e.textContent=v+'°';DEMOS.D5.update(E('stage'),D5p);}
function D6set(a,b){
  if(a)D6p.a1=+a;
  if(b)D6p.a2=+b;
  if(D6p.a1+D6p.a2>160)D6p.a2=160-D6p.a1;
  var e1=E('d6v1');if(e1)e1.textContent=D6p.a1+'°';
  var e2=E('d6v2');if(e2)e2.textContent=D6p.a2+'°';
  DEMOS.D6.update(E('stage'),D6p);
}
function D7set(v){D7p.angle=Math.max(1,Math.min(90,+v));var e=E('d7v');if(e)e.textContent=D7p.angle+'°';DEMOS.D7.update(E('stage'),D7p);}
</script>

<!-- ========== 第 4 段：页面 / 演示引擎 / 答题 / 教师端 ========== -->
<script>
var STATIONS=[
 {id:1,name:'线的世界',demos:['D1']},
 {id:2,name:'角的诞生',demos:['D2','D3']},
 {id:3,name:'量角器的秘密',demos:['D4','D5']},
 {id:4,name:'角的应用',demos:['D6','D7']}
];
var stack=[];
function go(fn,crumb){if(crumb){var c=E('crumb');if(c)c.textContent=crumb;}stack.push(fn);try{fn();}catch(e){if(window.onerror)window.onerror(e.message,'',0);}window.scrollTo(0,0);}
function goBack(){
  if(typeof CUR!=='undefined'&&CUR&&CUR.timer)clearTimeout(CUR.timer);
  stack.pop();
  var f=stack[stack.length-1];
  if(f)f();else home();
  window.scrollTo(0,0);
}
function setView(h){var v=E('view');if(v)v.innerHTML=h;}

/* ---------- 主页：单元地图 ---------- */
function home(){
  var c=E('crumb');if(c)c.textContent='四年级上册 · 数学';
  var u='';
  for(var i=0;i<UNITS.length;i++){
    var n=i+1,lock=(n!==2);
    u+='<div class="unit '+(lock?'locked':'active')+'" onclick="'+(lock?'lockTip()':'unit2()')+'">'+
        (lock?'':'<span class="badge-new">已解锁</span>')+
        '<div><div class="no">第'+n+'单元</div><div class="nm">'+UNITS[i]+'</div></div>'+
        '<div class="small">'+(lock?'🔒':'探索馆 · 挑战馆')+'</div></div>';
  }
  setView('<div class="wrap"><div class="h1">数学探险地图</div><div class="sub">先去看看"角"，那里藏着一整个圆的小秘密。</div><div class="units">'+u+'</div></div>');
  hud();
}
function lockTip(){
  sfx('tip');
  modal('<div class="h1" style="font-size:1.1rem">小探险家</div><p>这片区域还在建造中，先去<b>"角的度量"</b>解锁你的量角器技能吧！</p><div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeMask()">好，去看看</button></div>');
}
function unit2(){
  var c=E('crumb');if(c)c.textContent='角的度量';
  var doneD=0,k;
  for(k in S.done){if(S.done[k]&&S.done[k].c)doneD++;}
  var qDone=0;
  for(k in S.stat){if(S.stat[k])qDone+=S.stat[k].t;}
  setView('<div class="wrap"><div class="h1">第二单元 · 角的度量</div>'+
   '<div class="sub">度量就是数单位——一个角里有几个1°，它就是几度。</div>'+
   '<div class="entry">'+
   '<button class="big" onclick="exploreMap()">🔭<b>探索馆</b><span>七个小演示<br>已通关 '+doneD+' / 7</span></button>'+
   '<button class="big" onclick="challengeHome()">🎯<b>挑战馆</b><span>8 类题型 · 基础/提升/挑战<br>已完成 '+qDone+' 题</span></button>'+
   '</div>'+
   '<div class="card" style="margin-top:.9rem"><div class="row" style="justify-content:space-between"><b>我的回顾本</b>'+
   '<button class="btn mini" onclick="reviewBook()">打开（'+S.wrong.length+' 条）</button></div>'+
   '<div class="small">这里放没有想清楚的地方。</div></div></div>');
  hud();
}

/* ---------- 探索馆：全部开放 ---------- */
function exploreMap(){
  var c=E('crumb');if(c)c.textContent='探索馆';
  var html='<div class="wrap"><div class="h1">探索馆 · 路线图</div><div class="sub">七个小演示，从哪一站开始都可以，做完会留个记号。</div>';
  for(var i=0;i<STATIONS.length;i++){
    var st=STATIONS[i];
    html+='<div class="station"><div class="st-head"><span class="dot">'+st.id+'</span>第'+st.id+'站 · '+st.name+'</div>';
    for(var j=0;j<st.demos.length;j++){
      var d=st.demos[j],dm=DEMOS[d],done=S.done[d]&&S.done[d].c;
      html+='<div class="demo '+(done?'done':'')+'" onclick="startDemo(\''+d+'\')">'+
       '<span class="ic">'+dm.icon+'</span><span><b>'+dm.name+'</b><small>'+dm.desc+'</small></span>'+
       '<span style="margin-left:auto">'+(done?starIcons(S.done[d].star||2):'▶️')+'</span></div>';
    }
    html+='</div>';
  }
  html+='</div>';
  setView(html);hud();
}

/* ---------- 演示页：用 DOM 搭建，三个环节随便点 ---------- */
var CUR=null;
function startDemo(id){CUR={id:id,phase:1,step:0,p:{},timer:null};renderDemo();}
function renderDemo(){
  var d=DEMOS[CUR.id];
  var c=E('crumb');if(c)c.textContent='探索馆 · '+d.name;
  var v=E('view');if(!v)return;
  v.innerHTML='';
  function mk(tag,cls,txt,id){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(txt!=null)e.textContent=txt;
    if(id)e.id=id;
    return e;
  }
  var wrap=mk('div','wrap');
  wrap.appendChild(mk('div','h1',d.icon+' '+d.name));
  wrap.appendChild(mk('div','sub',d.desc));
  var stage=mk('div','stage',null,'stage');wrap.appendChild(stage);
  var big=mk('div','bignum',null,'bignum');big.style.display='none';wrap.appendChild(big);
  wrap.appendChild(mk('div','subtitle','准备好了就点"▶️ 开始演示"，先看一遍，再自己动手。','subtitle'));
  var ph=mk('div','phases');
  var nm=['① 看演示','② 动手玩','③ 小挑战'];
  for(var i=0;i<3;i++){
    (function(n){
      var e=mk('div','ph'+(n===1?' on':''),nm[n-1],'ph'+n);
      e.onclick=function(){setPhase(n);};
      ph.appendChild(e);
    })(i+1);
  }
  wrap.appendChild(ph);
  wrap.appendChild(mk('div','card',null,'ctl'));
  wrap.appendChild(mk('div',null,null,'panel'));
  v.appendChild(wrap);
  d.mount(stage);
  d.update(stage,{});
  setPhase(1);
}
function setPhase(n){
  CUR.phase=n;
  for(var i=1;i<=3;i++){
    var e=E('ph'+i);
    if(!e)continue;
    e.className='ph'+((i===n)?' on':((i<n)?' done':''));
  }
  if(n===1)phase1();else if(n===2)phase2();else phase3();
}
function phase1(){
  var d=DEMOS[CUR.id];
  CUR.step=0;CUR.p={};
  clearTimeout(CUR.timer);
  var st=E('subtitle'),ct=E('ctl'),pn=E('panel');
  if(!st||!ct||!pn)return;
  st.innerHTML='准备好了就点"▶️ 开始演示"，先看一遍，再自己动手。';
  ct.innerHTML='<div class="row"><button class="btn primary" id="bp" onclick="playDemo()">▶️ 开始演示</button>'+
   '<button class="btn" onclick="pauseDemo()">⏸ 暂停</button><button class="btn" onclick="replayDemo()">🔁 重看</button></div>';
  pn.innerHTML='';
  d.mount(E('stage'));
  d.update(E('stage'),{});
}
function playDemo(){
  var d=DEMOS[CUR.id];
  clearTimeout(CUR.timer);
  var stage=E('stage'),bp=E('bp'),st=E('subtitle');
  if(!stage||!bp||!st){CUR.step=d.script.length;return;}
  if(CUR.step>=d.script.length){
    bp.textContent='✅ 演示看完了，去动手玩';
    bp.onclick=function(){setPhase(2);};
    return;
  }
  var s=d.script[CUR.step];
  if(s.p){for(var k in s.p)CUR.p[k]=s.p[k];}
  d.update(stage,CUR.p);
  st.innerHTML=s.text;
  bp.textContent='▶️ 演示中…（'+(CUR.step+1)+' / '+d.script.length+'）';
  CUR.timer=setTimeout(function(){CUR.step++;playDemo();},s.t*1000);
}
function pauseDemo(){
  clearTimeout(CUR.timer);
  var b=E('bp');if(b)b.textContent='▶️ 继续演示';
  sfx('click');
}
function replayDemo(){
  clearTimeout(CUR.timer);
  CUR.step=0;CUR.p={};
  var stage=E('stage');
  if(!stage)return;
  DEMOS[CUR.id].mount(stage);
  DEMOS[CUR.id].update(stage,{});
  var b=E('bp');
  if(b){b.textContent='▶️ 开始演示';b.onclick=playDemo;}
  var s=E('subtitle');
  if(s)s.innerHTML='再看一遍，这次注意看数字是怎么变的。';
}
function phase2(){
  var d=DEMOS[CUR.id];
  var ct=E('ctl'),pn=E('panel'),stage=E('stage');
  if(!ct||!pn||!stage)return;
  ct.innerHTML='<div class="tasks">'+d.explore.tasks.map(function(t,i){return '<div class="task"><b>任务'+(i+1)+'</b> '+t+'</div>';}).join('')+'</div>'+d.explore.controls;
  pn.innerHTML='<div class="card"><b>我发现了——</b><div class="row" style="margin-top:.4rem">'+
   d.explore.discover.map(function(o){return '<button class="btn mini" onclick="discover(this,\''+o[0]+'\')">'+o[0]+'</button>';}).join('')+
   '</div><div id="dsc" class="fb tip" style="display:none"></div>'+
   '<div class="row" style="margin-top:.6rem;justify-content:flex-end"><button class="btn primary" onclick="setPhase(3)">玩够了，去小挑战 →</button></div></div>';
  var p={};
  for(var k in CUR.p)p[k]=CUR.p[k];
  d.update(stage,p);
}
function discover(btn,val){
  var d=DEMOS[CUR.id];
  var box=E('dsc');
  if(val===d.explore.answer){
    sfx('ok');
    btn.className='btn mini on';
    $$('#panel .btn.mini').forEach(function(b){b.disabled=true;});
    if(box){box.style.display='block';box.innerHTML='🎉 你自己发现啦！<b>'+d.explore.right+'</b>';}
    if(!(S.done[CUR.id]&&S.done[CUR.id].e)){S.done[CUR.id]=S.done[CUR.id]||{};S.done[CUR.id].e=1;save();addStar(1);}
  }else{
    sfx('tip');
    if(box){box.style.display='block';box.innerHTML='再回动画里试一试，把滑块来回拖几次，答案自己会冒出来。';}
  }
}
function phase3(){
  var list=[];
  var q=allQ();
  for(var i=0;i<q.length;i++){if(q[i].demo===CUR.id&&q[i].mini)list.push(q[i]);}
  if(!list.length){finishDemo();return;}
  var ct=E('ctl');if(ct)ct.innerHTML='';
  runQuiz(list,{mini:true,title:'小挑战（不计分，只是想确认一下）',el:'#panel',onEnd:finishDemo});
}
function finishDemo(){
  var id=CUR.id;
  S.done[id]=S.done[id]||{};
  S.done[id].c=1;
  S.done[id].star=Math.max(S.done[id].star||0,2);
  save();
  addCoin(5);sfx('star');
  var ct=E('ctl'),pn=E('panel');
  if(ct)ct.innerHTML='';
  if(pn)pn.innerHTML='<div class="card"><b>✅ 这一站走完啦</b><div class="small">你拿到了 1 颗星和 5 枚金币。</div>'+
   '<div class="row" style="margin-top:.6rem"><button class="btn primary" onclick="exploreMap()">回到路线图</button>'+
   '<button class="btn" onclick="startDemo(\''+id+'\')">再看一遍</button></div></div>';
}

/* ---------- 答题引擎 ---------- */
var QZ=null;
function runQuiz(list,opt){
  opt=opt||{};
  QZ={list:list.slice(),i:0,mini:!!opt.mini,title:opt.title||'挑战馆',el:opt.el,onEnd:opt.onEnd,
      firstTry:0,coin:0,tries:0,usedHint:false,done:false,answer:null,kp:'',order:[],angle:null,clockAng:null};
  if(!QZ.mini){var c=E('crumb');if(c)c.textContent=QZ.title;}
  renderQuiz();
}
function renderQuiz(){
  if(QZ.i>=QZ.list.length){finishQuiz();return;}
  var q=QZ.list[QZ.i];
  QZ.tries=0;QZ.usedHint=false;QZ.done=false;QZ.answer=null;QZ.kp='';QZ.order=[];QZ.angle=null;QZ.clockAng=null;
  var host=QZ.mini?$(QZ.el||'#panel'):E('view');
  if(!host)return;
  var head=QZ.mini?'':('<div class="row" style="justify-content:space-between"><b>'+QZ.title+'</b><span class="small">第 '+(QZ.i+1)+' / '+QZ.list.length+' 题</span></div><div class="progress"><i style="width:'+Math.round(QZ.i/QZ.list.length*100)+'%"></i></div>');
  host.innerHTML=head+'<div class="card"><div class="small" style="margin-bottom:.3rem">'+q.topic+' · '+['','基础','提升','挑战'][q.diff||2]+'</div>'+
   '<div style="font-size:1.1rem;font-weight:700;margin-bottom:.4rem">'+esc(q.stem)+'</div><div id="qarea"></div>'+
   '<div class="row" style="margin-top:.8rem;justify-content:space-between;width:100%">'+
   '<button class="btn mini" id="hintBtn" onclick="useHint()" disabled>💡 需要一点线索</button>'+
   '<button class="btn primary" id="subBtn" onclick="submitAns()">确认</button></div><div id="fb"></div></div>';
  drawQ(q);
}
function drawQ(q){
  var a=E('qarea');if(!a)return;
  if(q.type==='choice'){
    var h='';
    for(var i=0;i<q.options.length;i++)h+='<button class="opt" id="op'+i+'" onclick="pickOne('+i+')">'+'ABCD'[i]+'．'+esc(q.options[i])+'</button>';
    a.innerHTML=h;
  }else if(q.type==='keypad'){
    var v='';
    for(var n=1;n<=9;n++)v+='<button onclick="kpPush('+n+')">'+n+'</button>';
    v+='<button onclick="kpPush(0)">0</button><button onclick="kpDel()">删除</button><button onclick="kpClr()">清空</button>';
    a.innerHTML='<div class="row"><span>我的答案：</span><span class="blank" id="kp">?</span><span>'+(q.unit||'')+'</span></div><div class="keypad">'+v+'</div>';
  }else if(q.type==='classify'){
    var it='';
    for(var j=0;j<q.items.length;j++)it+='<span class="chip" id="it-'+q.items[j].id+'" onclick="pickItem(\''+q.items[j].id+'\')">'+esc(q.items[j].t)+'</span>';
    var bk='';
    for(var m=0;m<q.baskets.length;m++)bk+='<div class="basket" onclick="dropTo(\''+q.baskets[m]+'\')"><b>'+esc(q.baskets[m])+'</b><div id="in-'+q.baskets[m]+'" class="small"></div></div>';
    a.innerHTML='<div class="row" style="margin-bottom:.3rem">'+it+'</div><div class="basket-row">'+bk+'</div><div class="small">先点上面的图形，再点下面的筐。点错了可以再点别的筐。</div>';
    QZ.assign={};QZ.curItem=null;
  }else if(q.type==='order'){
    a.innerHTML='<div id="pool" class="row"></div><div class="card" style="margin-top:.5rem;box-shadow:none"><b>我的顺序</b><div id="slot" class="small" style="margin-top:.3rem">（还没选）</div></div>';
    drawOrder();
  }else if(q.type==='draw'){
    a.innerHTML='<div class="stage" id="drawstage"></div><div class="slider" style="margin-top:.5rem"><span>转动射线</span><input type="range" min="1" max="180" value="20" oninput="drawRay(this.value)"><b id="drawV">20°</b></div><div class="small">把它转到正好 '+q.target+'°。</div>';
    drawRay(20);
  }else if(q.type==='clock'){
    a.innerHTML='<div class="stage" id="clkstage"></div><div class="slider" style="margin-top:.5rem"><span>时针指向</span><input type="range" min="0" max="11" value="0" oninput="clockSet(this.value)"><b id="ckV">12时 · 夹角 0°</b></div><div class="small">分针一直指着12，拖动时针，让夹角正好是 '+q.target+'°。</div>';
    clockSet(0);
  }
}
function pickOne(i){
  if(QZ.done)return;
  sfx('click');QZ.answer=i;
  var q=QZ.list[QZ.i];
  for(var k=0;k<q.options.length;k++){var e=E('op'+k);if(e)e.className='opt'+(k===i?' sel':'');}
}
function kpPush(n){if(QZ.done)return;sfx('click');if((''+QZ.kp).length>=4)return;QZ.kp=(''+QZ.kp)+n;var e=E('kp');if(e)e.textContent=QZ.kp;}
function kpDel(){if(QZ.done)return;QZ.kp=(''+QZ.kp).slice(0,-1);var e=E('kp');if(e)e.textContent=QZ.kp||'?';}
function kpClr(){if(QZ.done)return;QZ.kp='';var e=E('kp');if(e)e.textContent='?';}
function pickItem(id){
  if(QZ.done)return;
  sfx('click');QZ.curItem=id;
  $$('.chip').forEach(function(e){e.classList.remove('picked');});
  var t=E('it-'+id);if(t)t.classList.add('picked');
}
function dropTo(b){
  if(QZ.done)return;
  if(!QZ.curItem){toast('先点上面一个图形，再点这个筐');return;}
  sfx('snap');
  QZ.assign[QZ.curItem]=b;
  QZ.curItem=null;
  $$('.chip').forEach(function(e){e.classList.remove('picked');});
  var q=QZ.list[QZ.i];
  for(var i=0;i<q.baskets.length;i++){
    var bk=q.baskets[i],ids=[];
    for(var k in QZ.assign){
      if(QZ.assign[k]===bk){
        for(var j=0;j<q.items.length;j++){if(q.items[j].id===k)ids.push(q.items[j].t);}
      }
    }
    var el=E('in-'+bk);
    if(el)el.innerHTML=ids.map(function(t){return '<span class="chip picked">'+t+'</span>';}).join('');
  }
}
function drawOrder(){
  var q=QZ.list[QZ.i];
  var pool='';
  for(var i=0;i<q.steps.length;i++){if(QZ.order.indexOf(i)<0)pool+='<span class="chip" onclick="putOrder('+i+')">'+esc(q.steps[i])+'</span>';}
  var slot='';
  for(var k=0;k<QZ.order.length;k++)slot+='<span class="chip picked" onclick="delOrder('+k+')">'+(k+1)+'. '+esc(q.steps[QZ.order[k]])+'</span>';

function isRight(){
  var q=QZ.list[QZ.i];
  if(q.type==='choice')return QZ.answer===q.answer;
  if(q.type==='keypad')return (''+QZ.kp)!==''&&Number(QZ.kp)===q.answer;
  if(q.type==='classify'){
    for(var i=0;i<q.items.length;i++){
      var it=q.items[i],want=null;
      for(var b in q.answer){if(q.answer[b].indexOf(it.id)>=0)want=b;}
      if(QZ.assign[it.id]!==want)return false;
    }
    return true;
  }
  if(q.type==='order')return QZ.order.length===q.answer.length&&QZ.order.every(function(v,i){return v===q.answer[i];});
  if(q.type==='draw')return Math.abs(QZ.angle-q.target)===0;
  if(q.type==='clock')return (QZ.clockAng===q.target);
  return false;
}
function submitAns(){
  if(QZ.done)return;
  var q=QZ.list[QZ.i];
  if(q.type==='choice'&&QZ.answer===null){toast('先选一个答案吧');return;}
  if(q.type==='keypad'&&(''+QZ.kp)===''){toast('先输入一个数字');return;}
  if(q.type==='order'&&QZ.order.length!==q.steps.length){toast('把步骤全部排好再确认');return;}
  if(q.type==='classify'){
    for(var i=0;i<q.items.length;i++){if(!QZ.assign[q.items[i].id]){toast('还有图形没有放进筐里');return;}}
  }
  if(q.type==='clock'&&QZ.clockAng===null)QZ.clockAng=0;
  var fb=E('fb');
  if(isRight()){
    sfx('ok');QZ.done=true;
    var gained=(QZ.tries===0&&!QZ.usedHint)?2:1;
    if(!QZ.mini){addStar(gained);addCoin(4);QZ.coin+=4;if(QZ.tries===0&&!QZ.usedHint)QZ.firstTry++;}
    if(q.type==='choice'){
      for(var k=0;k<q.options.length;k++){var e=E('op'+k);if(e)e.className='opt'+(k===q.answer?' ok':'');}
    }
    var tip=QZ.mini?'':((QZ.tries===0&&!QZ.usedHint)?'（一次就想通，拿到 1 颗星）':'（自己想通的，拿到半颗星）');
    if(fb)fb.innerHTML='<div class="fb good"><b>🎉 答对啦！</b>'+(QZ.mini?'':'<span class="small">'+tip+'</span>')+
     '<ul class="steps">'+q.solution.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>'+
     '<div class="small">'+esc(q.explain||'')+'</div>'+
     '<div class="row" style="justify-content:flex-end;margin-top:.5rem"><button class="btn primary" onclick="nextQ()">'+((QZ.i+1>=QZ.list.length)?'看看结果 →':'下一题 →')+'</button></div></div>';
    var sb=E('subBtn');if(sb)sb.style.display='none';

  }else{
    sfx('tip');QZ.tries++;
    if(q.type==='choice'&&QZ.answer!==null){var e2=E('op'+QZ.answer);if(e2)e2.className='opt no';}
    recordStat(q.topic,false);
    if(!QZ.mini)addWrong(q);
    if(QZ.tries===1){
      if(fb)fb.innerHTML='<div class="fb tip"><b>这里有个小陷阱，再试一次吧！</b><div style="margin-top:.3rem">💭 '+esc(q.hint1||'再想想看。')+'</div></div>';
      QZ.answer=null;
      if(q.type==='choice'){for(var m=0;m<q.options.length;m++){var e3=E('op'+m);if(e3)e3.className='opt';}}
    }else if(QZ.tries===2){
      if(fb)fb.innerHTML='<div class="fb tip"><b>再想一想——</b><div style="margin-top:.3rem">💭 '+esc(q.hint2||'回到演示里看一眼，规律就出来了。')+'</div><div class="small" style="margin-top:.3rem">需要我带你回探索馆找线索吗？点左下角的 💡</div></div>';
      var hb2=E('hintBtn');if(hb2)hb2.disabled=false;
      QZ.answer=null;
      if(q.type==='choice'){for(var n2=0;n2<q.options.length;n2++){var e4=E('op'+n2);if(e4)e4.className='opt';}}
    }else{
      QZ.done=true;
      if(fb)fb.innerHTML='<div class="fb tip"><b>我们一起走一遍思路：</b><ul class="steps">'+q.solution.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>'+

function startTopic(topic){
  var pool=allQ().filter(function(q){return !q.mini&&(!topic||q.topic===topic);});
  if(pool.length<6)pool=allQ().filter(function(q){return !q.mini;});
  var easy=pool.filter(function(q){return q.diff===1;});
  var mid=pool.filter(function(q){return q.diff===2;});
  var hard=pool.filter(function(q){return q.diff===3;});
  function pick(a,n){var b=a.slice(),o=[];while(o.length<n&&b.length)o.push(b.splice(Math.floor(Math.random()*b.length),1)[0]);return o;}
  var list=pick(easy,2).concat(pick(mid,3)).concat(pick(hard,1));
  var i=0;
  while(list.length<6&&pool.length>0){if(list.indexOf(pool[i%pool.length])<0)list.push(pool[i%pool.length]);i++;}
  go(function(){runQuiz(list,{title:'挑战馆 · '+(topic||'混合闯关')});},'挑战馆');
}

/* ---------- 教师端：题库管理 ---------- */
function checkQ(q){
  var e=[];
  if(!q||typeof q!=='object')return ['不是一条题目'];
  if(!q.id)e.push('缺少 id');
  if(!q.stem)e.push('缺少 stem');
  var T=['choice','keypad','classify','order','draw','clock'];
  if(T.indexOf(q.type)<0)e.push('type 只能是 '+T.join(' / '));
  if(q.type==='choice'){
    if(!Array.isArray(q.options)||q.options.length<2)e.push('choice 需要 options 数组（至少2项）');
    if(typeof q.answer!=='number')e.push('choice 的 answer 要填选项序号，从0开始');
  }
  if(q.type==='keypad'&&typeof q.answer!=='number')e.push('keypad 的 answer 要填数字');
  if(q.type==='classify'){
    if(!Array.isArray(q.items)||!q.items.length)e.push('classify 需要 items 数组');
    if(!Array.isArray(q.baskets)||!q.baskets.length)e.push('classify 需要 baskets 数组');
    if(!q.answer||typeof q.answer!=='object')e.push('classify 需要 answer 对象');
  }
  if(q.type==='order'){
    if(!Array.isArray(q.steps)||!q.steps.length)e.push('order 需要 steps 数组');
    if(!Array.isArray(q.answer))e.push('order 需要 answer 数组（正确顺序的下标）');
  }
  if((q.type==='draw'||q.type==='clock')&&typeof q.target!=='number')e.push(q.type+' 需要数字 target');
  if(!Array.isArray(q.solution))e.push('建议补上 solution 数组（分步算式）');
  return e;
}
function normalizeQ(q,i){
  var o={};
  o.id=q.id||('自定义'+Date.now()+'_'+i);
  o.topic=q.topic||'未分类';
  o.demo=q.demo||'D2';
  o.mini=0;
  o.diff=(q.diff===1||q.diff===2||q.diff===3)?q.diff:2;
  o.type=q.type;
  o.stem=q.stem||'';
  o.options=q.options||null;
  o.answer=q.answer;
  o.steps=q.steps||null;
  o.items=q.items||null;
  o.baskets=q.baskets||null;
  o.target=q.target||0;
  o.unit=q.unit||'';
  o.hint1=q.hint1||'再读一遍题目，把已知条件圈出来。';
  o.hint2=q.hint2||'回到探索馆看一眼演示，规律就出来了。';
  o.solution=Array.isArray(q.solution)?q.solution:[];
  o.explain=q.explain||'';
  o.culture=q.culture||'';
  return o;
}
function bankListHTML(){
  var b=S.bank||[];
  if(!b.length)return '<div class="small">还没有导入自定义题。可以点下面的按钮下载模板。</div>';
  var h='';
  b.forEach(function(q,i){
    h+='<div class="qitem"><span>'+esc(q.topic)+'｜'+esc(q.type)+'｜'+esc(q.stem).slice(0,26)+'…</span>'+
       '<button class="btn mini" onclick="delBank('+i+')">删除</button></div>';
  });
  return h;
}
function refreshBankList(){var e=E('banklist');if(e)e.innerHTML=bankListHTML();}
function openTeacher(){
  var total=BUILTIN.length+(S.bank||[]).length;
  modal('<div class="h1" style="font-size:1.15rem">🧑‍🏫 教师端 · 题库管理</div>'+

   '<div class="card" style="box-shadow:none"><b>导入题库</b>'+
   '<div class="row" style="margin-top:.4rem"><input type="file" id="bankfile" accept=".json,application/json" onchange="importBankFile(this)"></div>'+
   '<textarea class="ta" id="banktext" placeholder=\'粘贴 JSON 数组，例如：[{"id":"C001","topic":"角的分类","demo":"D2","type":"choice","stem":"比直角小的角是什么角？","options":["锐角","直角","钝角"],"answer":0,"hint1":"想想门只开一小缝的时候。","hint2":"比90°小的角是锐角。","solution":["比直角小，就是锐角"],"explain":"锐角比直角小。","diff":1}]\'></textarea>'+
   '<div class="row" style="margin-top:.4rem"><button class="btn dark" onclick="importBankText()">从文本框导入</button>'+

   '<button class="btn" onclick="exportBank()">导出当前题库</button></div>'+
   '<div id="bankmsg" class="small" style="margin-top:.4rem"></div></div>'+
   '<div class="card" style="box-shadow:none"><b>自定义题目（可逐条删除）</b><div id="banklist" style="max-height:14rem;overflow:auto;margin-top:.3rem">'+bankListHTML()+'</div>'+
   '<button class="btn" style="margin-top:.4rem" onclick="clearBank()">清空全部自定义题</button></div>'+
   '<div class="card" style="box-shadow:none"><b>说明</b><div class="small">'+
   '支持的 type：choice（选择）、keypad（填数字）、classify（分类）、order（排序）、draw（拖到指定角度）、clock（钟面拖时针）。<br>'+
   '选填字段：topic 知识点、demo 关联演示（D1到D7任一）、diff 难度1/2/3、hint1/hint2 两次提示、solution 分步算式、explain 一句话结论、culture 文化情境。<br>'+
   '导入的题目会立刻出现在挑战馆里，并一起进入知识漏洞雷达图。</div></div>'+
   '<div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeMask()">关闭</button></div>');
}
function importBankText(){
  var t=E('banktext'),m=E('bankmsg');
  try{
    var arr=JSON.parse(t?t.value:'');
    if(!Array.isArray(arr))throw new Error('最外层要是一个数组');
    doImport(arr,m);
  }catch(e){if(m)m.innerHTML='<b style="color:#C0392B">导入失败：'+esc(e.message)+'</b>';}
}
function importBankFile(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var arr=JSON.parse(r.result);
      if(!Array.isArray(arr))throw new Error('最外层要是一个数组');
      doImport(arr,E('bankmsg'));
    }catch(e){toast('导入失败：'+e.message);}
  };
  r.readAsText(f,'utf-8');
}
function doImport(arr,msg){
  var ok=[],bad=[];
  arr.forEach(function(q,i){
    var e=checkQ(q);
    if(e.length)bad.push('第'+(i+1)+'条：'+e.join('；'));
    else ok.push(normalizeQ(q,i));
  });
  S.bank=(S.bank||[]).concat(ok);
  save();
  var h='<b style="color:#2E9E5B">成功导入 '+ok.length+' 道题</b>';
  if(bad.length)h+='<br><b style="color:#E67E22">有 '+bad.length+' 条没导入：</b><br>'+bad.slice(0,6).map(esc).join('<br>')+(bad.length>6?'<br>…':'');
  if(msg)msg.innerHTML=h;
  toast('导入 '+ok.length+' 道题');
  refreshBankList();
}
function delBank(i){S.bank.splice(i,1);save();refreshBankList();toast('已删除');}
function clearBank(){
  modal('<div class="h1" style="font-size:1.05rem">清空自定义题？</div><div class="small">内置题库不受影响。</div>'+
   '<div class="row" style="justify-content:flex-end;margin-top:.7rem"><button class="btn" onclick="openTeacher()">取消</button>'+
   '<button class="btn primary" onclick="S.bank=[];save();openTeacher();toast(\'已清空\');">确定</button></div>');
}

   {id:'C001',topic:'角的分类',demo:'D2',type:'choice',stem:'比直角小的角是什么角？',options:['锐角','直角','钝角'],answer:0,diff:1,
    hint1:'想想门只开一小缝的时候。',hint2:'比90°小的角是锐角。',solution:['比直角小，就是锐角'],explain:'锐角比直角小。',culture:'火把只转一点点'},
   {id:'C002',topic:'量角读数',demo:'D4',type:'keypad',stem:'量角器0刻度线在右边，另一条边指着内圈58°，这个角是多少度？',answer:58,unit:'°',diff:2,
    hint1:'0在右边，读内圈。',hint2:'内圈数字直接读出来就是度数。',solution:['0刻度线在右，读内圈','另一条边指着58°'],explain:'0刻度线在哪边，就读哪一圈。',culture:'量角器就是180个1°'},
   {id:'C003',topic:'线的认识',demo:'D1',type:'order',stem:'把"认识线段"的步骤排好。',steps:['找到一个点','再找一个点','两点之间画一条直直的线','标上两个端点'],answer:[0,1,2,3],diff:1,
    hint1:'画线段要先有端点。',hint2:'两个端点定下来，线就定下来了。',solution:['两个端点确定','中间连一条直直的线'],explain:'线段有两个端点。',culture:'竹竿'}
  ];
  try{
    var blob=new Blob([JSON.stringify(tpl,null,2)],{type:'application/json;charset=utf-8'});

function exportBank(){
  try{
    var blob=new Blob([JSON.stringify(allQ(),null,1)],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='角的度量题库.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('题库已导出，共 '+allQ().length+' 题');
  }catch(e){toast('导出失败');}
}
